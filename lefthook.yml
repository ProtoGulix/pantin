# Git hooks. Installed automatically by `pnpm install` (lefthook postinstall).
pre-commit:
  piped: true
  jobs:
    - name: protected-branches
      run: scripts/git-guards/protected-branch-commit.sh
    - name: check
      run: pnpm check

pre-push:
  jobs:
    - name: protected-branches
      run: scripts/git-guards/protected-branch-push.sh
      use_stdin: true

commit-msg:
  piped: true
  jobs:
    - name: protected-branches
      run: scripts/git-guards/protected-branch-commit.sh --allow-merge
    - name: conventional-commits
      # Header must follow Conventional Commits: type(optional scope)!: description
      # Merge and revert messages written by git pass, as in Tunnel (ADR 0044).
      run: >-
        head -n1 {1} | grep -qE '^(Merge|Revert)' ||
        head -n1 {1} | grep -qE
        '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9-]+\))?!?: .+'
        || { echo "Commit header must follow Conventional Commits, e.g. 'feat(core): add prismatic joint'"; exit 1; }

post-commit:
  jobs:
    - name: graphify-update
      # Incremental, AST only: no LLM call, no token cost. Skipped when graphify is absent.
      run: command -v graphify >/dev/null 2>&1 && graphify update . >/dev/null 2>&1 || true
