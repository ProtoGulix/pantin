<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pantin</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Sets the theme before the first paint, so a light page never flashes dark. It repeats
         resolveTheme and the stored key of src/theme/theme.ts and ui/browser-storage.ts, which
         the page then takes over (tests/viewer-index-theme.test.ts keeps them in step). -->
    <script>
      (() => {
        var stored = null;
        try {
          stored = window.localStorage.getItem("pantin.viewer.theme");
        } catch {
          // Storage disabled: follow the system, as with no stored choice.
          stored = null;
        }
        var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var theme = stored === "light" || stored === "dark" ? stored : dark ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <link rel="stylesheet" href="/src/styles/fonts.css" />
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/styles/panel.css" />
    <link rel="stylesheet" href="/src/styles/message-line.css" />
    <link rel="stylesheet" href="/src/styles/list-and-prompt.css" />
    <link rel="stylesheet" href="/src/styles/tree.css" />
    <link rel="stylesheet" href="/src/styles/properties.css" />
    <link rel="stylesheet" href="/src/styles/menu-bar.css" />
    <link rel="stylesheet" href="/src/styles/viewport.css" />
    <link rel="stylesheet" href="/src/styles/zones.css" />
    <link rel="stylesheet" href="/src/styles/inspector.css" />
    <link rel="stylesheet" href="/src/styles/switch-diagram.css" />
    <link rel="stylesheet" href="/src/styles/diagram.css" />
    <link rel="stylesheet" href="/src/styles/joint-star.css" />
    <link rel="stylesheet" href="/src/styles/joint-star-controls.css" />
    <link rel="stylesheet" href="/src/styles/diagram-wiring.css" />
    <link rel="stylesheet" href="/src/styles/diagram-toolbar.css" />
    <link rel="stylesheet" href="/src/styles/io.css" />
    <link rel="stylesheet" href="/src/styles/bridge-panel.css" />
    <link rel="stylesheet" href="/src/styles/journal.css" />
    <link rel="stylesheet" href="/src/styles/about.css" />

  <body>
    <!-- Texts and labels are set from the translation files at start-up (ADR 0010). -->
    <header id="menu-bar" class="menu-bar"></header>
    <div class="layout">
      <aside id="side-panel" class="side-panel"></aside>
      <div class="central">
      <div id="transport" class="transport" hidden></div>
      <main class="viewport">
        <canvas
          id="viewport-canvas"
          class="viewport__canvas zone-view"
          data-central-view="3d"
          tabindex="-1"
        ></canvas>

        <p id="viewport-hint" class="viewport__hint"></p>

        <div id="about" class="welcome-overlay" hidden></div>
      </main>
      <section id="console" class="console" hidden></section>
      <div id="console-bar" class="console-bar" hidden></div>
      </div>
      <aside id="inspector" class="inspector" hidden></aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
