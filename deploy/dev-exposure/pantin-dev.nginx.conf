# Pantin development exposure (ADR 0014): pantin-dev.frezille.fr -> core on 127.0.0.1:4800,
# and the user guide under /docs/ (ADR 0051).
# Only behind a Cloudflare Access policy. Installation: see README.md next to this file.

server {
    listen 80;
    server_name pantin-dev.frezille.fr;

    # Only cloudflared, which connects from this machine, may use this site:
    # nginx listens on every interface, and anyone on the LAN could otherwise
    # send this Host header and reach the core without Cloudflare Access.
    allow 127.0.0.1;
    allow ::1;
    deny all;

    # Plain HTTP that did not come through Cloudflare: redirect to HTTPS.
    # Convenience only: the header can be forged, it protects nothing.
    if ($http_x_forwarded_proto != "https") {
        return 301 https://$host$request_uri;
    }

    # Mesh imports go up to 200 MB (MAX_IMPORT_BYTES); nginx refuses bodies
    # above 1 MB by default. Streamed to the core instead of buffered on disk.
    client_max_body_size 200m;
    proxy_request_buffering off;

    # The PLC bridge's tag bus (ADR 0045, ADR 0046 point 7) is never published:
    # it can write the machine's commands, and the Access token is not checked
    # at the origin. A regex location wins over "/" below. The core refuses a
    # bus upgrade that carries X-Pantin-Exposure too, so removing this block
    # alone still fails closed.
    # Trailing slashes too: the core ignores empty path segments.
    location ~ ^/api/pantins/[^/]+/bus/*$ {
        return 403;
    }

    # The user guide (ADR 0051), static files copied by hand from
    # docs/site/.vitepress/dist: nginx cannot read the home directory. ^~
    # keeps the regex location above from being tried on these paths.
    # Relative redirects: nginx sees plain HTTP from cloudflared and would
    # otherwise send the browser to http://, then back through the HTTPS redirect.
    # Like that redirect, `return` runs before allow/deny: a LAN client gets this
    # constant 301, never a page.
    location = /docs {
        absolute_redirect off;
        return 301 /docs/;
    }
    location ^~ /docs/ {
        absolute_redirect off;
        root /var/www/pantin-dev;
        # VitePress clean URLs: /docs/guide/model is guide/model.html.
        try_files $uri $uri.html $uri/ =404;
        error_page 404 /docs/404.html;
    }

    location / {
        proxy_pass http://127.0.0.1:4800;
        # Tells the core the request came through this exposure; replaces any
        # value the client sent (proxy_set_header always overrides it).
        proxy_set_header X-Pantin-Exposure cloudflare;
        # The core only trusts its own address as Host (DNS rebinding
        # protection, ADR 0004); nginx is where the public name is dropped.
        proxy_set_header Host 127.0.0.1:4800;
        proxy_http_version 1.1;
        # The pose stream (ADR 0015) must reach the browser event by event.
        proxy_buffering off;
        # A STEP conversion can take tens of seconds.
        proxy_read_timeout 300s;
    }
}
