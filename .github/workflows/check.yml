name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The pnpm version comes from the packageManager field of package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pnpm install --frozen-lockfile
      # STEP converter environment (ADR 0009), needed by the Python checks and
      # by the core's end to end STEP import test.
      - run: pnpm setup:python
      - run: pnpm check
